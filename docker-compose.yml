services:
  ttp:
    build:
      context: .           
      dockerfile: docker/Dockerfile
      args:
        TARGET_NAME: ttp-app
    container_name: ttp
    ports:
      - "6601:6600"
    command: ["./appexe", "--port=6600"]

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        TARGET_NAME: server-app
    container_name: server
    ports:
      - "6600:6600"
    depends_on:
      ttp:
        condition: service_started 
    command: ["./appexe", "--port=6600"]
